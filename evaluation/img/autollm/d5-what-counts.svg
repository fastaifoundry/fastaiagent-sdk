<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="What counts as a failure: a case that passed, failed, errored or paused; errored and paused cases count as failures in a candidate's score, are never shown to the proposer, and a proposer that cannot run is reported rather than counted as no improvement.">
  <title>What counts as a failure: a case that passed, failed, errored or paused; errored and paused cases count as failures in a candidate's score, are never shown to the proposer, and a proposer that cannot run is reported rather than counted as no improvement.</title>
  <rect x="0" y="0" width="1200" height="640" rx="0" fill="#fcfcfb" stroke="none" stroke-width="2"/>
  <text x="48" y="62" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0b0b0b" text-anchor="start">A crash is not a pass — what a score counts</text>
  <text x="48" y="98" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#52514e" text-anchor="start">Scoring one split of six cases</text>
  <rect x="48" y="130" width="170" height="96" rx="12" fill="#e5f6ef" stroke="#1baf7a" stroke-width="2"/>
  <text x="64" y="162" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">case 1</text>
  <text x="64" y="190" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1baf7a" text-anchor="start">passed</text>
  <polyline points="184,160 191,168 205,151" fill="none" stroke="#1baf7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="234" y="130" width="170" height="96" rx="12" fill="#e5f6ef" stroke="#1baf7a" stroke-width="2"/>
  <text x="250" y="162" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">case 2</text>
  <text x="250" y="190" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1baf7a" text-anchor="start">passed</text>
  <polyline points="370,160 377,168 391,151" fill="none" stroke="#1baf7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="420" y="130" width="170" height="96" rx="12" fill="#fdefe8" stroke="#eb6834" stroke-width="2"/>
  <text x="436" y="162" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">case 3</text>
  <text x="436" y="190" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eb6834" text-anchor="start">failed</text>
  <circle cx="566" cy="160" r="14" fill="#fcfcfb"/>
  <line x1="559" y1="153" x2="573" y2="167" stroke="#eb6834" stroke-width="3"/>
  <line x1="559" y1="167" x2="573" y2="153" stroke="#eb6834" stroke-width="3"/>
  <rect x="606" y="130" width="170" height="96" rx="12" fill="#fdefe8" stroke="#eb6834" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="622" y="162" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">case 4</text>
  <text x="622" y="190" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eb6834" text-anchor="start">errored</text>
  <circle cx="752" cy="160" r="14" fill="#fcfcfb"/>
  <line x1="745" y1="153" x2="759" y2="167" stroke="#eb6834" stroke-width="3"/>
  <line x1="745" y1="167" x2="759" y2="153" stroke="#eb6834" stroke-width="3"/>
  <rect x="792" y="130" width="170" height="96" rx="12" fill="#fdefe8" stroke="#eb6834" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="808" y="162" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">case 5</text>
  <text x="808" y="190" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eb6834" text-anchor="start">paused</text>
  <circle cx="938" cy="160" r="14" fill="#fcfcfb"/>
  <line x1="931" y1="153" x2="945" y2="167" stroke="#eb6834" stroke-width="3"/>
  <line x1="931" y1="167" x2="945" y2="153" stroke="#eb6834" stroke-width="3"/>
  <rect x="978" y="130" width="170" height="96" rx="12" fill="#e5f6ef" stroke="#1baf7a" stroke-width="2"/>
  <text x="994" y="162" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">case 6</text>
  <text x="994" y="190" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1baf7a" text-anchor="start">passed</text>
  <polyline points="1114,160 1121,168 1135,151" fill="none" stroke="#1baf7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="48" y="262" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">errored: a provider error, a guardrail block, MaxIterationsError</text>
  <text x="48" y="282" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">paused: waiting for an approval — it never answered</text>
  <rect x="48" y="314" width="1104" height="120.0" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="62" y="346" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">the candidate's score</text>
  <text x="62" y="368.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">score = passed / (scored + errored)   →   3 / 6 = 0.500</text>
  <text x="62" y="390.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">evaluate() on its own reports 3 / 4 = 0.750: it leaves errored cases out of its scores.</text>
  <text x="62" y="412.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">AutoLLM counts them in (1.85.0) — before, a prompt that crashed on its hard cases could win.</text>
  <rect x="48" y="470" width="540" height="140" rx="12" fill="#ffffff" stroke="#d6d4cc" stroke-width="2"/>
  <text x="68" y="506" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">what reaches the proposer</text>
  <text x="68" y="531" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">failed cases — with expected output and reason</text>
  <text x="68" y="553" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">errored cases — never: a fault the agent can't fix</text>
  <polyline points="546,526 553,534 567,517" fill="none" stroke="#1baf7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="556" cy="552" r="14" fill="#fcfcfb"/>
  <line x1="549" y1="545" x2="563" y2="559" stroke="#eb6834" stroke-width="3"/>
  <line x1="549" y1="559" x2="563" y2="545" stroke="#eb6834" stroke-width="3"/>
  <rect x="612" y="470" width="540" height="140" rx="12" fill="#fdefe8" stroke="#eb6834" stroke-width="2"/>
  <text x="632" y="506" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">when the proposer itself can't run</text>
  <text x="632" y="531" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">the round is recorded as skipped: proposer failed: …</text>
  <text x="632" y="553" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">it never counts as 'no improvement' —</text>
  <text x="632" y="575" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">every round failing ends the run as proposer_failed</text>
</svg>
