<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" role="img" aria-label="One AutoLLM run: the dataset is split with a seed into train, dev and holdout; the baseline is scored on dev; each round proposes candidates on one lever, scores them on dev and keeps one only if it beats the best; then a holdout guard scores the baseline and the winner on data the search never saw and reverts a winner that regressed.">
  <title>One AutoLLM run: the dataset is split with a seed into train, dev and holdout; the baseline is scored on dev; each round proposes candidates on one lever, scores them on dev and keeps one only if it beats the best; then a holdout guard scores the baseline and the winner on data the search never saw and reverts a winner that regressed.</title>
  <rect x="0" y="0" width="1200" height="790" rx="0" fill="#fcfcfb" stroke="none" stroke-width="2"/>
  <text x="48" y="62" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0b0b0b" text-anchor="start">One run: a split, a climb, and a guard</text>
  <text x="48" y="98" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#52514e" text-anchor="start">Rounds keep only what beats the best on dev. The holdout decides whether to believe it.</text>
  <path d="M48,146 L48,224 A115.0,16 0 0 0 278,224 L278,146" fill="#e5f6ef" stroke="#1baf7a" stroke-width="2.5"/>
  <ellipse cx="163.0" cy="146" rx="115.0" ry="16" fill="#e5f6ef" stroke="#1baf7a" stroke-width="2.5"/>
  <text x="163" y="190" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="middle">your dataset</text>
  <text x="163" y="216" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52514e" text-anchor="middle">input · expected · …</text>
  <polyline points="163,240 163,286" fill="none" stroke="#52514e" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="163,286 170.0,272.0 156.0,272.0" fill="#52514e"/>
  <rect x="94.39999999999999" y="254.8" width="137.20000000000002" height="21.6" rx="4" fill="#fcfcfb" stroke="none" stroke-width="2"/>
  <text x="163" y="270" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#52514e" text-anchor="middle">seeded shuffle</text>
  <rect x="48" y="292" width="230" height="46" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="62" y="321.48" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#0b0b0b" text-anchor="start">train · 50%</text>
  <rect x="48" y="344" width="230" height="46" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="62" y="373.48" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#0b0b0b" text-anchor="start">dev · 25%</text>
  <rect x="48" y="396" width="230" height="46" rx="8" fill="#fdefe8" stroke="#eb6834" stroke-width="1.5"/>
  <text x="62" y="425.48" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#0b0b0b" text-anchor="start">holdout · 25%</text>
  <text x="60" y="470" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#eb6834" text-anchor="start">holdout is locked until</text>
  <text x="60" y="492" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#eb6834" text-anchor="start">the search is over</text>
  <rect x="48" y="560" width="250" height="96" rx="12" fill="#ffffff" stroke="#d6d4cc" stroke-width="2"/>
  <text x="68" y="596" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">0 · baseline</text>
  <text x="68" y="622" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">your agent as it is,</text>
  <text x="68" y="645" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">scored on dev</text>
  <polyline points="298,608 340,608 340,450" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="340,450 333.0,464.0 347.0,464.0" fill="#2a78d6"/>
  <rect x="330" y="130" width="520" height="520" rx="18" fill="none" stroke="#2a78d6" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="352" y="164" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2a78d6" text-anchor="start">ONE ROUND · repeated</text>
  <rect x="350" y="186" width="230" height="128" rx="12" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="370" y="222" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">1 · propose</text>
  <text x="370" y="245" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">N candidates on top of the</text>
  <text x="370" y="265" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">best, on this round's lever:</text>
  <text x="370" y="285" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">instructions → fewshot</text>
  <text x="370" y="305" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">→ memory, one per round</text>
  <polyline points="580,250 610,250" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="610,250 596.0,243.0 596.0,257.0" fill="#2a78d6"/>
  <rect x="610" y="186" width="220" height="128" rx="12" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="630" y="222" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">2 · score on dev</text>
  <text x="630" y="247" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">each candidate is one real</text>
  <text x="630" y="269" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">evaluate() run — a fresh</text>
  <text x="630" y="291" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">copy of your agent</text>
  <polyline points="720,314 720,350" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="720,350 727.0,336.0 713.0,336.0" fill="#2a78d6"/>
  <rect x="430" y="350" width="300" height="70" rx="12" fill="#ffffff" stroke="#d6d4cc" stroke-width="2"/>
  <text x="450" y="386" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">3 · beats the best by ≥ min_delta?</text>
  <polyline points="500,420 460,470" fill="none" stroke="#1baf7a" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="460,470 474.2,463.4 463.3,454.7" fill="#1baf7a"/>
  <polyline points="660,420 700,470" fill="none" stroke="#eb6834" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="700,470 696.7,454.7 685.8,463.4" fill="#eb6834"/>
  <rect x="350" y="470" width="240" height="46" rx="8" fill="#e5f6ef" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="364" y="499.12" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#0b0b0b" text-anchor="start">ACCEPT → the new best</text>
  <rect x="610" y="470" width="220" height="46" rx="8" fill="#fdefe8" stroke="#eb6834" stroke-width="1.5"/>
  <text x="624" y="499.12" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#0b0b0b" text-anchor="start">reject → patience + 1</text>
  <text x="352" y="560" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">stops on:  patience · max_iterations · target_score</text>
  <text x="352" y="582" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">           budget · proposer_failed</text>
  <polyline points="850,300 880,300" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="880,300 866.0,293.0 866.0,307.0" fill="#2a78d6"/>
  <polyline points="278,419 310,419 310,700 1016,700 1016,470" fill="none" stroke="#eb6834" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <polygon points="1016,470 1009.0,484.0 1023.0,484.0" fill="#eb6834"/>
  <rect x="880" y="130" width="272" height="340" rx="16" fill="none" stroke="#eb6834" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="900" y="164" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#eb6834" text-anchor="start">HOLDOUT GUARD</text>
  <rect x="896" y="184" width="240" height="92" rx="12" fill="#ffffff" stroke="#d6d4cc" stroke-width="2"/>
  <text x="916" y="220" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">score the baseline</text>
  <text x="916" y="245" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">on holdout, with the</text>
  <text x="916" y="267" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">audit judge</text>
  <rect x="896" y="288" width="240" height="92" rx="12" fill="#ffffff" stroke="#d6d4cc" stroke-width="2"/>
  <text x="916" y="324" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">score the winner</text>
  <text x="916" y="349" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">same split, same judge</text>
  <text x="900" y="412" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">winner &lt; baseline − tol ?</text>
  <circle cx="912" cy="442" r="14" fill="#fcfcfb"/>
  <line x1="905" y1="435" x2="919" y2="449" stroke="#eb6834" stroke-width="3"/>
  <line x1="905" y1="449" x2="919" y2="435" stroke="#eb6834" stroke-width="3"/>
  <text x="928" y="448" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#eb6834" text-anchor="start">reverted — you keep v1</text>
  <polyline points="1016,470 1016,520" fill="none" stroke="#1baf7a" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="1016,520 1023.0,506.0 1009.0,506.0" fill="#1baf7a"/>
  <polyline points="994,498 1001,506 1015,489" fill="none" stroke="#1baf7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="880" y="520" width="272" height="130" rx="12" fill="#e5f6ef" stroke="#1baf7a" stroke-width="2"/>
  <text x="900" y="556" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">the report</text>
  <text x="900" y="581" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">dev and holdout numbers</text>
  <text x="900" y="603" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">every candidate, with its score</text>
  <text x="900" y="625" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">apply_to(agent) → a fresh agent</text>
</svg>
