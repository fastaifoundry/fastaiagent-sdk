<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="A guardrail is a position and three questions: it sits at one of four gates on the run loop (input, tool_call, tool_result, output); blocking decides whether it runs inline and can halt, on_error what an un-runnable check means, action what a genuine failure costs; every rule resolves to one GuardrailResult with passed, errored, action, action_taken and modified_data, and leaves one span.">
  <title>A guardrail is a position and three questions: it sits at one of four gates on the run loop (input, tool_call, tool_result, output); blocking decides whether it runs inline and can halt, on_error what an un-runnable check means, action what a genuine failure costs; every rule resolves to one GuardrailResult with passed, errored, action, action_taken and modified_data, and leaves one span.</title>
  <rect x="0" y="0" width="1200" height="680" rx="0" fill="#fcfcfb" stroke="none" stroke-width="2"/>
  <text x="48" y="62" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0b0b0b" text-anchor="start">A guardrail is a position and three questions</text>
  <rect x="48" y="130" width="150" height="80" rx="12" fill="#fdefe8" stroke="#eb6834" stroke-width="2"/>
  <text x="68" y="166" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="start">input</text>
  <polyline points="198,170 250,170" fill="none" stroke="#52514e" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="250,170 236.0,163.0 236.0,177.0" fill="#52514e"/>
  <rect x="250" y="130" width="190" height="80" rx="12" fill="#ffffff" stroke="#d6d4cc" stroke-width="2"/>
  <text x="270" y="166" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">the model</text>
  <text x="270" y="188" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">decides</text>
  <polyline points="440,170 500,170" fill="none" stroke="#52514e" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="500,170 486.0,163.0 486.0,177.0" fill="#52514e"/>
  <rect x="500" y="130" width="150" height="80" rx="12" fill="#fdefe8" stroke="#eb6834" stroke-width="2"/>
  <text x="520" y="166" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="start">tool_call</text>
  <polyline points="650,170 700,170" fill="none" stroke="#52514e" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="700,170 686.0,163.0 686.0,177.0" fill="#52514e"/>
  <rect x="700" y="130" width="150" height="80" rx="12" fill="#ffffff" stroke="#d6d4cc" stroke-width="2"/>
  <text x="720" y="166" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">the tool</text>
  <text x="720" y="188" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">runs</text>
  <polyline points="850,170 900,170" fill="none" stroke="#52514e" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="900,170 886.0,163.0 886.0,177.0" fill="#52514e"/>
  <rect x="900" y="130" width="150" height="80" rx="12" fill="#fdefe8" stroke="#eb6834" stroke-width="2"/>
  <text x="920" y="166" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">tool_result</text>
  <polyline points="975,210 975,240 345,240 345,210" fill="none" stroke="#52514e" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <polygon points="345,210 338.0,224.0 352.0,224.0" fill="#52514e"/>
  <rect x="527.875" y="243.65" width="264.25" height="17.55" rx="4" fill="#fcfcfb" stroke="none" stroke-width="2"/>
  <text x="660" y="256" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#52514e" text-anchor="middle">back to the model, until it answers</text>
  <polyline points="345,240 345,290 123,290 123,318" fill="none" stroke="#52514e" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="123,318 130.0,304.0 116.0,304.0" fill="#52514e"/>
  <rect x="48" y="318" width="150" height="80" rx="12" fill="#fdefe8" stroke="#eb6834" stroke-width="2"/>
  <text x="68" y="354" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="start">output</text>
  <text x="220" y="350" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">four gates; a rule declares which one it sits at</text>
  <text x="220" y="372" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">(a plane rule's 'tool' means tool_call)</text>
  <rect x="560" y="290" width="592" height="120.0" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="574" y="322" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">three questions, three fields</text>
  <text x="574" y="344.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">blocking   does it run inline, and can it halt?</text>
  <text x="574" y="366.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">on_error   what does an un-runnable check mean?</text>
  <text x="574" y="388.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">action     what does a genuine failure cost?</text>
  <rect x="48" y="430" width="560" height="93.0" rx="10" fill="#e5f6ef" stroke="#1baf7a" stroke-width="2"/>
  <text x="62" y="462" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">every rule resolves to one GuardrailResult</text>
  <text x="62" y="483.0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">passed · errored · action · action_taken · modified_data</text>
  <text x="62" y="504.0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">branch on action_taken — what it did, never what it was told</text>
  <rect x="650" y="430" width="502" height="110" rx="12" fill="#e5f6ef" stroke="#1baf7a" stroke-width="2"/>
  <text x="670" y="466" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">and leaves one span</text>
  <text x="670" y="489" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">guardrail.&lt;name&gt;, on a pass as well as a block</text>
  <text x="670" y="509" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">fastaiagent.guardrail.* · detail is an allowlist</text>
  <text x="48" y="600" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start" font-style="italic">A blocking failure raises GuardrailBlockedError out of the run; everything else is recorded on AgentResult.guardrails.</text>
</svg>
