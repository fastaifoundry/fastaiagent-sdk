<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-label="Between the record and the world: recorded mode fixes the model's words, not the tools; since 1.89.0 a rerun blocks every tool you did not supply, the model gets an error naming it, and the call is counted in blocked_tool_calls; with_tool_policy('live', allow=[...]) runs the real function again in the process that defined it, and finds none in a fresh process; REST and MCP tools run only when allowed; with_tool_override and with_tool_stub swap a tool for your own; replay_class is recorded on every tool span, defaults to side_effecting and is never inferred.">
  <title>Between the record and the world: recorded mode fixes the model's words, not the tools; since 1.89.0 a rerun blocks every tool you did not supply, the model gets an error naming it, and the call is counted in blocked_tool_calls; with_tool_policy('live', allow=[...]) runs the real function again in the process that defined it, and finds none in a fresh process; REST and MCP tools run only when allowed; with_tool_override and with_tool_stub swap a tool for your own; replay_class is recorded on every tool span, defaults to side_effecting and is never inferred.</title>
  <rect x="0" y="0" width="1200" height="740" rx="0" fill="#fcfcfb" stroke="none" stroke-width="2"/>
  <text x="48" y="62" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0b0b0b" text-anchor="start">Between the record and the world: a rerun runs only the tools you give it</text>
  <rect x="48" y="120" width="340" height="160" rx="12" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="68" y="156" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">default: blocked</text>
  <text x="68" y="178" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">every tool you did not supply →</text>
  <text x="68" y="197" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">an error result naming it;</text>
  <text x="68" y="216" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">charges = [42.0]  (not again)</text>
  <text x="68" y="235" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">blocked_tool_calls={'charge_card': 1}</text>
  <rect x="430" y="120" width="340" height="160" rx="12" fill="#fdefe8" stroke="#eb6834" stroke-width="2"/>
  <text x="450" y="156" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">live, allow=[…]</text>
  <text x="450" y="178" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">same process: the real function</text>
  <text x="450" y="197" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">runs → charges = [42.0, 42.0];</text>
  <text x="450" y="216" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">fresh process: no function;</text>
  <text x="450" y="235" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">REST / MCP: only when allowed</text>
  <rect x="812" y="120" width="340" height="160" rx="12" fill="#e5f6ef" stroke="#1baf7a" stroke-width="2"/>
  <text x="832" y="156" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">override / stub</text>
  <text x="832" y="178" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">with_tool_override(name, fn)</text>
  <text x="832" y="197" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">with_tool_stub(name, returns=…)</text>
  <text x="832" y="216" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">never registered globally;</text>
  <text x="832" y="235" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">with_tools([…]) replaces them all</text>
  <text x="48" y="320" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start" font-style="italic">Why the blocked rerun's output still matched: the next model turn is served from the recording whatever the tool returned.</text>
  <text x="48" y="344" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start" font-style="italic">So the rerun says it: blocked_tool_calls, a warning, and compare().tool_diffs with each changed tool call's disposition.</text>
  <rect x="48" y="390" width="1104" height="200" rx="14" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="68" y="422" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2a78d6" text-anchor="start">replay_class · on every tool span as fastaiagent.tool.replay_class</text>
  <rect x="68" y="450" width="180" height="34" rx="8" fill="#e5f6ef" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="82" y="472.04" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start">read_only</text>
  <text x="264" y="473" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">may be re-executed: a GET, a pure lookup</text>
  <rect x="68" y="492" width="180" height="34" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="82" y="514.04" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start">idempotent</text>
  <text x="264" y="515" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">recorded output injected; re-running is safe but pointless</text>
  <rect x="68" y="534" width="180" height="34" rx="8" fill="#fdefe8" stroke="#eb6834" stroke-width="1.5"/>
  <text x="82" y="556.04" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start">side_effecting</text>
  <text x="264" y="557" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">the default · recorded output injected, never re-executed</text>
  <text x="700" y="473" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#eb6834" text-anchor="start">never inferred: a GET RESTTool is side_effecting</text>
  <text x="700" y="497" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">until you say otherwise; the central Replay engine</text>
  <text x="700" y="521" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">reads the class to choose inject vs. execute;</text>
  <text x="700" y="545" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">the SDK's rerun blocks whatever you didn't allow</text>
  <text x="48" y="630" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">Rule: nothing a rerun calls runs for real unless you named it. with_tool_policy('error') raises instead of blocking.</text>
  <text x="48" y="680" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8a8880" text-anchor="start">Code: trace/replay.py::_build_tool_plan · tool/_replay_blocked.py · tool/base.py (replay_class)</text>
</svg>
