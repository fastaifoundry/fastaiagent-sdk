<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="The call is a sandwich: a list of Message objects is normalized into the provider's wire body, sent in one HTTP request wrapped in one llm span, and the provider's JSON is parsed back into one LLMResponse with content, tool calls as dicts, normalized usage, a finish reason, client-side latency and an optional parsed object. Both ends are provider-neutral.">
  <title>The call is a sandwich: a list of Message objects is normalized into the provider's wire body, sent in one HTTP request wrapped in one llm span, and the provider's JSON is parsed back into one LLMResponse with content, tool calls as dicts, normalized usage, a finish reason, client-side latency and an optional parsed object. Both ends are provider-neutral.</title>
  <rect x="0" y="0" width="1200" height="620" rx="0" fill="#fcfcfb" stroke="none" stroke-width="2"/>
  <text x="48" y="62" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0b0b0b" text-anchor="start">The call is a sandwich — neutral ends, a provider-shaped middle</text>
  <rect x="300" y="110" width="640" height="230" rx="18" fill="none" stroke="#1baf7a" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="324" y="142" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1baf7a" text-anchor="start">ONE SPAN  llm.&lt;provider&gt;.&lt;model&gt;  —  gen_ai.* · cost · prompt provenance</text>
  <rect x="48" y="170" width="230" height="110" rx="12" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="68" y="206" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">Message[]</text>
  <text x="68" y="229" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">system · user · assistant</text>
  <text x="68" y="249" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">tool, with tool_call_id</text>
  <polyline points="278,225 330,225" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="330,225 316.0,218.0 316.0,232.0" fill="#2a78d6"/>
  <rect x="264.825" y="292.65" width="78.35000000000001" height="17.55" rx="4" fill="#fcfcfb" stroke="none" stroke-width="2"/>
  <text x="304" y="305" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#52514e" text-anchor="middle">normalize</text>
  <rect x="330" y="170" width="250" height="110" rx="12" fill="#fdefe8" stroke="#eb6834" stroke-width="2"/>
  <text x="350" y="206" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">the wire body</text>
  <text x="350" y="228" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">provider-shaped</text>
  <text x="350" y="247" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">to_provider_dict + body builder</text>
  <polyline points="580,225 660,225" fill="none" stroke="#52514e" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="660,225 646.0,218.0 646.0,232.0" fill="#52514e"/>
  <rect x="598.7" y="292.65" width="42.6" height="17.55" rx="4" fill="#fcfcfb" stroke="none" stroke-width="2"/>
  <text x="620" y="305" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#52514e" text-anchor="middle">HTTP</text>
  <rect x="660" y="170" width="250" height="110" rx="12" fill="#fdefe8" stroke="#eb6834" stroke-width="2"/>
  <text x="680" y="206" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">provider JSON</text>
  <text x="680" y="228" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">provider-shaped</text>
  <text x="680" y="247" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">choices · content[] · candidates</text>
  <polyline points="910,225 962,225" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="962,225 948.0,218.0 948.0,232.0" fill="#2a78d6"/>
  <rect x="911.125" y="292.65" width="49.75" height="17.55" rx="4" fill="#fcfcfb" stroke="none" stroke-width="2"/>
  <text x="936" y="305" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#52514e" text-anchor="middle">parse</text>
  <rect x="962" y="170" width="190" height="110" rx="12" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="982" y="206" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">LLMResponse</text>
  <text x="982" y="229" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">one shape,</text>
  <text x="982" y="249" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">every provider</text>
  <rect x="48" y="370" width="1104" height="177.0" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="62" y="402" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">LLMResponse</text>
  <text x="62" y="423.0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">content: str | None      — None on a tool-call turn</text>
  <text x="62" y="444.0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">tool_calls: [ToolCall]   — arguments already a dict</text>
  <text x="62" y="465.0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">usage: dict              — prompt_tokens · completion_tokens · total_tokens, plus provider extras</text>
  <text x="62" y="486.0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">finish_reason: str       — 'stop' | 'tool_calls' | 'length'</text>
  <text x="62" y="507.0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">latency_ms: int          — measured here, wall-clock</text>
  <text x="62" y="528.0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">parsed: Any              — your output_type, or None</text>
</svg>
