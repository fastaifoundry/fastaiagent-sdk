<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="A name, a wire, a set of flags: six built-in providers have code paths; twelve presets are configuration over an existing wire with a base URL, an env var, a default model and capability flags; register_provider adds one in five lines; a preset without native response_format gets the schema appended to its system prompt, and parallel_tool_calls is dropped.">
  <title>A name, a wire, a set of flags: six built-in providers have code paths; twelve presets are configuration over an existing wire with a base URL, an env var, a default model and capability flags; register_provider adds one in five lines; a preset without native response_format gets the schema appended to its system prompt, and parallel_tool_calls is dropped.</title>
  <rect x="0" y="0" width="1200" height="640" rx="0" fill="#fcfcfb" stroke="none" stroke-width="2"/>
  <text x="48" y="62" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0b0b0b" text-anchor="start">A name, a wire, a set of flags</text>
  <rect x="48" y="130" width="300" height="140" rx="12" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="68" y="166" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">built-ins — code paths</text>
  <text x="68" y="189" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">openai · anthropic · ollama</text>
  <text x="68" y="209" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">azure · bedrock · custom</text>
  <text x="68" y="229" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">(+ test, the offline stand-in)</text>
  <rect x="48" y="300" width="300" height="200" rx="12" fill="#e5f6ef" stroke="#1baf7a" stroke-width="2"/>
  <text x="68" y="336" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">presets — configuration</text>
  <text x="68" y="359" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">12 shipped · register_provider()</text>
  <text x="68" y="379" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">base_url · env_var · default_model</text>
  <text x="68" y="399" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">wire: openai_compat | native_gemini</text>
  <text x="68" y="419" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">capabilities: tools, streaming,</text>
  <text x="68" y="439" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">  response_format, parallel_tool_calls</text>
  <rect x="400" y="130" width="370" height="205.5" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="414" y="162" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">register_provider(ProviderPreset(</text>
  <text x="414" y="181.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">  key="corp-gateway",</text>
  <text x="414" y="201.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">  base_url="https://llm.corp/v1",</text>
  <text x="414" y="221.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">  env_var="CORP_GATEWAY_KEY",</text>
  <text x="414" y="241.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">  default_model="house-7b",</text>
  <text x="414" y="261.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">  wire="openai_compat",</text>
  <text x="414" y="281.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">  capabilities={"response_format": False,</text>
  <text x="414" y="301.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">                "parallel_tool_calls": False}))</text>
  <text x="414" y="321.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">LLMClient(provider="corp-gateway")</text>
  <polyline points="770,230 820,230" fill="none" stroke="#eb6834" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="820,230 806.0,223.0 806.0,237.0" fill="#eb6834"/>
  <rect x="820" y="130" width="332" height="220" rx="12" fill="#fdefe8" stroke="#eb6834" stroke-width="2"/>
  <text x="840" y="166" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">what the flags do to the body</text>
  <text x="840" y="188" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">response_format=False →</text>
  <text x="840" y="207" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">  the JSON schema is appended to the</text>
  <text x="840" y="226" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">  system prompt; no response_format key</text>
  <text x="840" y="245" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">parallel_tool_calls=False → key dropped</text>
  <text x="840" y="264" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">a preset → max_tokens, never</text>
  <text x="840" y="283" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">  max_completion_tokens</text>
  <polyline points="402,400 409,408 423,391" fill="none" stroke="#1baf7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="430" y="406" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1baf7a" text-anchor="start">the API key comes from the preset's env var</text>
  <circle cx="412" cy="440" r="14" fill="#fcfcfb"/>
  <line x1="405" y1="433" x2="419" y2="447" stroke="#eb6834" stroke-width="3"/>
  <line x1="405" y1="447" x2="419" y2="433" stroke="#eb6834" stroke-width="3"/>
  <text x="430" y="446" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#eb6834" text-anchor="start">a reserved key (openai, anthropic, …) cannot be re-registered</text>
  <circle cx="412" cy="480" r="14" fill="#fcfcfb"/>
  <line x1="405" y1="473" x2="419" y2="487" stroke="#eb6834" stroke-width="3"/>
  <line x1="405" y1="487" x2="419" y2="473" stroke="#eb6834" stroke-width="3"/>
  <text x="430" y="486" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#eb6834" text-anchor="start">a preset registered in your code never reaches the fastaiagent ui process</text>
  <circle cx="412" cy="520" r="14" fill="#fcfcfb"/>
  <line x1="405" y1="513" x2="419" y2="527" stroke="#eb6834" stroke-width="3"/>
  <line x1="405" y1="527" x2="419" y2="513" stroke="#eb6834" stroke-width="3"/>
  <text x="430" y="526" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#eb6834" text-anchor="start">the flags are best-effort: a provider may have moved since the preset was written</text>
  <text x="48" y="590" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start" font-style="italic">proof 3: 19 provider keys from 7 built-ins and 12 presets; the gateway body had no response_format and no parallel_tool_calls.</text>
</svg>
