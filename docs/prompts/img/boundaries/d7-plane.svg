<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="Local rows, governed slugs: on the laptop the registry is rows in local.db, per project, and a pushed agent built from a local Prompt sends its text with no slug; on the control plane prompts have slugs, environments and analytics, get() reads platform-first with a five-minute cache, publish() writes, and an agent with prompt_slug sends the slug and an empty system prompt.">
  <title>Local rows, governed slugs: on the laptop the registry is rows in local.db, per project, and a pushed agent built from a local Prompt sends its text with no slug; on the control plane prompts have slugs, environments and analytics, get() reads platform-first with a five-minute cache, publish() writes, and an agent with prompt_slug sends the slug and an empty system prompt.</title>
  <rect x="0" y="0" width="1200" height="680" rx="0" fill="#fcfcfb" stroke="none" stroke-width="2"/>
  <text x="48" y="62" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0b0b0b" text-anchor="start">Local rows, governed slugs</text>
  <rect x="48" y="120" width="540" height="440" rx="18" fill="none" stroke="#8a8880" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="72" y="154" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#8a8880" text-anchor="start">YOUR LAPTOP</text>
  <path d="M76,196 L76,284 A105.0,16 0 0 0 286,284 L286,196" fill="#e5f6ef" stroke="#1baf7a" stroke-width="2.5"/>
  <ellipse cx="181.0" cy="196" rx="105.0" ry="16" fill="#e5f6ef" stroke="#1baf7a" stroke-width="2.5"/>
  <text x="181" y="232" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="middle">local.db</text>
  <text x="181" y="258" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="middle">per project</text>
  <rect x="316" y="180" width="250" height="120" rx="12" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="336" y="216" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">PromptRegistry</text>
  <text x="336" y="239" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">register · load · set_alias</text>
  <text x="336" y="259" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">diff · list · get(slug)</text>
  <polyline points="286,240 316,240" fill="none" stroke="#1baf7a" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="88" cy="340" r="14" fill="#fcfcfb"/>
  <line x1="81" y1="333" x2="95" y2="347" stroke="#eb6834" stroke-width="3"/>
  <line x1="81" y1="347" x2="95" y2="333" stroke="#eb6834" stroke-width="3"/>
  <text x="106" y="346" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#eb6834" text-anchor="start">another folder: another registry</text>
  <polyline points="78,380 85,388 99,371" fill="none" stroke="#1baf7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="106" y="386" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1baf7a" text-anchor="start">a new process reads the same rows</text>
  <rect x="76" y="420" width="490" height="110" rx="12" fill="#ffffff" stroke="#d6d4cc" stroke-width="2"/>
  <text x="96" y="456" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">Agent(system_prompt=&lt;local Prompt&gt;)</text>
  <text x="96" y="479" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">to_dict(): system_prompt = the text, no prompt_slug</text>
  <text x="96" y="499" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">the plane has no slug for a local prompt</text>
  <rect x="640" y="120" width="512" height="440" rx="18" fill="none" stroke="#1baf7a" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="664" y="154" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1baf7a" text-anchor="start">CONTROL PLANE</text>
  <rect x="668" y="180" width="456" height="120" rx="12" fill="#e5f6ef" stroke="#1baf7a" stroke-width="2"/>
  <text x="688" y="216" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">governed registry</text>
  <text x="688" y="239" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">slugs · versions · environments</text>
  <text x="688" y="259" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">draft / publish · Prompt Analytics</text>
  <rect x="668" y="320" width="456" height="86" rx="12" fill="#ffffff" stroke="#d6d4cc" stroke-width="2"/>
  <text x="688" y="356" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">get(slug), source='auto'</text>
  <text x="688" y="378" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">platform first when connected (5-minute cache), else local</text>
  <rect x="668" y="420" width="456" height="110" rx="12" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="688" y="456" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">Agent(prompt_slug='support-prompt')</text>
  <text x="688" y="479" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">to_dict(): prompt_slug + system_prompt ''</text>
  <text x="688" y="499" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">a plane Prompt stamps slug + environment too</text>
  <polyline points="566,220 668,220" fill="none" stroke="#1baf7a" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <polygon points="668,220 654.0,213.0 654.0,227.0" fill="#1baf7a"/>
  <rect x="575.35" y="192.7" width="83.30000000000001" height="18.900000000000002" rx="4" fill="#fcfcfb" stroke="none" stroke-width="2"/>
  <text x="617" y="206" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#52514e" text-anchor="middle">publish()</text>
  <polyline points="668,270 566,270" fill="none" stroke="#1baf7a" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <polygon points="566,270 580.0,277.0 580.0,263.0" fill="#1baf7a"/>
  <rect x="590.75" y="278.7" width="52.5" height="18.900000000000002" rx="4" fill="#fcfcfb" stroke="none" stroke-width="2"/>
  <text x="617" y="292" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#52514e" text-anchor="middle">get()</text>
  <text x="48" y="610" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start" font-style="italic">No plane was reachable when this page's proofs ran: section 6 shows what the SDK sends and refuses, not the plane's reply.</text>
</svg>
