<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-label="Between the record and the world: recorded mode fixes the model's words, not the tools; in the process that defined a tool the rebuilt agent calls the live function again; in a fresh process the tool has no function, the agent gets a tool error, and the recorded next turn still produces the recorded answer; with_tool_override swaps one tool for a stub; replay_class is recorded on every tool span, defaults to side_effecting and is never inferred.">
  <title>Between the record and the world: recorded mode fixes the model's words, not the tools; in the process that defined a tool the rebuilt agent calls the live function again; in a fresh process the tool has no function, the agent gets a tool error, and the recorded next turn still produces the recorded answer; with_tool_override swaps one tool for a stub; replay_class is recorded on every tool span, defaults to side_effecting and is never inferred.</title>
  <rect x="0" y="0" width="1200" height="740" rx="0" fill="#fcfcfb" stroke="none" stroke-width="2"/>
  <text x="48" y="62" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0b0b0b" text-anchor="start">Between the record and the world: tools run again</text>
  <rect x="48" y="120" width="340" height="160" rx="12" fill="#fdefe8" stroke="#eb6834" stroke-width="2"/>
  <text x="68" y="156" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">same process</text>
  <text x="68" y="178" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">FunctionTool registers itself</text>
  <text x="68" y="197" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">on creation; from_dict finds it</text>
  <text x="68" y="216" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">→ the real charge_card runs:</text>
  <text x="68" y="235" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">charges = [42.0, 42.0]</text>
  <rect x="430" y="120" width="340" height="160" rx="12" fill="#fdefe8" stroke="#eb6834" stroke-width="2"/>
  <text x="450" y="156" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">fresh process</text>
  <text x="450" y="178" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">not in ToolRegistry → rebuilt</text>
  <text x="450" y="197" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">with no function; the model sees</text>
  <text x="450" y="216" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">tool.error = 'No function attached'</text>
  <text x="450" y="235" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">→ output still 'Done: charged 42.00.'</text>
  <rect x="812" y="120" width="340" height="160" rx="12" fill="#e5f6ef" stroke="#1baf7a" stroke-width="2"/>
  <text x="832" y="156" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">with_tool_override</text>
  <text x="832" y="178" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">with_tool_override('charge_card', stub)</text>
  <text x="832" y="197" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">the stub runs instead;</text>
  <text x="832" y="216" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">charges unchanged, output recorded;</text>
  <text x="832" y="235" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">with_tools([…]) replaces them all</text>
  <text x="48" y="320" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start" font-style="italic">Why the fresh-process output still matched: the next model turn is served from the recording whatever the tool returned.</text>
  <text x="48" y="344" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start" font-style="italic">compare() reads span names and model outputs, not tool results — a tool that silently failed is not a divergence.</text>
  <rect x="48" y="390" width="1104" height="200" rx="14" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="68" y="422" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2a78d6" text-anchor="start">replay_class · on every tool span as fastaiagent.tool.replay_class</text>
  <rect x="68" y="450" width="180" height="34" rx="8" fill="#e5f6ef" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="82" y="472.04" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start">read_only</text>
  <text x="264" y="473" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">may be re-executed: a GET, a pure lookup</text>
  <rect x="68" y="492" width="180" height="34" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="82" y="514.04" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start">idempotent</text>
  <text x="264" y="515" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">recorded output injected; re-running is safe but pointless</text>
  <rect x="68" y="534" width="180" height="34" rx="8" fill="#fdefe8" stroke="#eb6834" stroke-width="1.5"/>
  <text x="82" y="556.04" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start">side_effecting</text>
  <text x="264" y="557" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">the default · recorded output injected, never re-executed</text>
  <text x="700" y="473" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#eb6834" text-anchor="start">never inferred: a GET RESTTool is side_effecting</text>
  <text x="700" y="497" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">until you say otherwise; the central Replay engine</text>
  <text x="700" y="521" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">reads the class to choose inject vs. execute;</text>
  <text x="700" y="545" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">the local rerun executes whatever has a function</text>
  <text x="48" y="630" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">Rule: a side-effecting tool only runs in a rerun when this process defines it, or you pass it in. Either is your explicit choice.</text>
  <text x="48" y="680" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8a8880" text-anchor="start">Code: tool/function.py::FunctionTool._from_dict · tool/base.py (replay_class) · trace/replay.py::_apply_tool_overrides</text>
</svg>
