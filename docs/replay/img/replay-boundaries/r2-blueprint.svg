<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Between the trace and the agent: the root span's attributes are the blueprint; arerun maps agent.system_prompt, agent.llm.config, agent.tools, agent.guardrails and agent.config into Agent.from_dict; the api_key is never in the trace and never read from it; a tool becomes the live registered function when this process defines it, otherwise a schema with no function; memory, the checkpointer, the plane identity and output_type are not rebuilt.">
  <title>Between the trace and the agent: the root span's attributes are the blueprint; arerun maps agent.system_prompt, agent.llm.config, agent.tools, agent.guardrails and agent.config into Agent.from_dict; the api_key is never in the trace and never read from it; a tool becomes the live registered function when this process defines it, otherwise a schema with no function; memory, the checkpointer, the plane identity and output_type are not rebuilt.</title>
  <rect x="0" y="0" width="1200" height="760" rx="0" fill="#fcfcfb" stroke="none" stroke-width="2"/>
  <text x="48" y="62" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0b0b0b" text-anchor="start">Between the trace and the agent: the root span is the blueprint</text>
  <rect x="48" y="120" width="420" height="205.5" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="62" y="152" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">root span · agent.shipping</text>
  <text x="62" y="171.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">agent.system_prompt  "You answer…"</text>
  <text x="62" y="191.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">agent.llm.config     {provider, model, …}</text>
  <text x="62" y="211.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">agent.tools          [{name, description,</text>
  <text x="62" y="231.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">                       parameters, replay_class}]</text>
  <text x="62" y="251.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">agent.guardrails     [{name, guardrail_type, …}]</text>
  <text x="62" y="271.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">agent.config         {max_iterations, …}</text>
  <text x="62" y="291.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">agent.input          "Where is order 1042?"</text>
  <text x="62" y="311.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">agent.output         "Order 1042 was…"</text>
  <polyline points="468,240 526,240" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="526,240 512.0,233.0 512.0,247.0" fill="#2a78d6"/>
  <text x="497" y="226" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">from_dict</text>
  <rect x="530" y="120" width="622" height="60" rx="12" fill="#ffffff" stroke="#d6d4cc" stroke-width="2"/>
  <text x="550" y="156" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">system_prompt</text>
  <text x="550" y="176" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">verbatim — or your modify_prompt</text>
  <rect x="530" y="190" width="622" height="76" rx="12" fill="#ffffff" stroke="#d6d4cc" stroke-width="2"/>
  <text x="550" y="226" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">llm_endpoint → LLMClient.from_dict</text>
  <text x="550" y="246" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">api_key never from the dict; resolved</text>
  <text x="550" y="264" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">from the environment; base_url http(s) only</text>
  <rect x="530" y="276" width="622" height="76" rx="12" fill="#ffffff" stroke="#d6d4cc" stroke-width="2"/>
  <text x="550" y="312" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">tools → Tool.from_dict</text>
  <text x="550" y="332" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">ToolRegistry.get(name) → the live function</text>
  <text x="550" y="350" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">else a schema with no function</text>
  <rect x="530" y="362" width="622" height="60" rx="12" fill="#ffffff" stroke="#d6d4cc" stroke-width="2"/>
  <text x="550" y="398" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">guardrails → Guardrail.from_dict</text>
  <text x="550" y="418" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">rebuilt, and they run again</text>
  <rect x="530" y="432" width="622" height="60" rx="12" fill="#ffffff" stroke="#d6d4cc" stroke-width="2"/>
  <text x="550" y="468" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">config → AgentConfig</text>
  <text x="550" y="488" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">max_iterations, tool_choice, …</text>
  <rect x="48" y="520" width="1104" height="118" rx="14" fill="#fdefe8" stroke="#eb6834" stroke-width="2"/>
  <text x="68" y="552" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#eb6834" text-anchor="start">NOT REBUILT — the rerun starts without:</text>
  <text x="68" y="580" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">memory          nothing is read into the prompt, nothing is written back</text>
  <text x="68" y="602" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">checkpointer    a pause cannot be held · plane agent_id   managed policies never gate it</text>
  <text x="68" y="624" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">output_type     a Python class is not in a trace; the response_format schema passes through</text>
  <text x="48" y="672" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start" font-style="italic">The proof rebuilt the agent in the defining process: the tool was the live function, the guardrail was back,</text>
  <text x="48" y="696" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start" font-style="italic">memory was None while the original's window held two messages, and the config had no api_key to leak.</text>
  <text x="48" y="736" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8a8880" text-anchor="start">Code: trace/replay.py::_build_agent_dict · agent/agent.py::Agent.from_dict · llm/client.py::LLMClient.from_dict · tool/function.py::_from_dict</text>
</svg>
