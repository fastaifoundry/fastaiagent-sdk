<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Between your process and the plane: every span lands in local.db marked unsent; OTel's batch processor only rings a doorbell; PlatformSpanExporter.export ignores the batch, drains unsent rows from the table, POSTs them to /public/v1/traces/ingest and marks them sent only after a 2xx; with the plane down the rows wait, the run is never blocked, and a bounded queue abandons the oldest from re-send while keeping them in local.db.">
  <title>Between your process and the plane: every span lands in local.db marked unsent; OTel's batch processor only rings a doorbell; PlatformSpanExporter.export ignores the batch, drains unsent rows from the table, POSTs them to /public/v1/traces/ingest and marks them sent only after a 2xx; with the plane down the rows wait, the run is never blocked, and a bounded queue abandons the oldest from re-send while keeping them in local.db.</title>
  <rect x="0" y="0" width="1200" height="700" rx="0" fill="#fcfcfb" stroke="none" stroke-width="2"/>
  <text x="48" y="62" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0b0b0b" text-anchor="start">Between your process and the plane: SQLite is the queue</text>
  <rect x="48" y="130" width="200" height="44" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="62" y="158.12" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#0b0b0b" text-anchor="start">a span ends</text>
  <polyline points="248,152 300,152" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="300,152 286.0,145.0 286.0,159.0" fill="#2a78d6"/>
  <path d="M300,126 L300,264 A140.0,16 0 0 0 580,264 L580,126" fill="#e5f6ef" stroke="#1baf7a" stroke-width="2.5"/>
  <ellipse cx="440.0" cy="126" rx="140.0" ry="16" fill="#e5f6ef" stroke="#1baf7a" stroke-width="2.5"/>
  <text x="440" y="160" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="middle">local.db · synced = 0</text>
  <text x="440" y="190" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="middle" font-style="italic">the queue is the table</text>
  <text x="440" y="214" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="middle">fetch_unsynced · mark_synced</text>
  <rect x="48" y="230" width="200" height="44" rx="8" fill="#ffffff" stroke="#d6d4cc" stroke-width="1.5"/>
  <text x="62" y="257.4" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#0b0b0b" text-anchor="start">BatchSpanProcessor</text>
  <polyline points="248,252 640,252" fill="none" stroke="#8a8880" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="6 6"/>
  <polygon points="640,252 626.0,245.0 626.0,259.0" fill="#8a8880"/>
  <rect x="223.49999999999997" y="219.65" width="443.00000000000006" height="17.55" rx="4" fill="#fcfcfb" stroke="none" stroke-width="2"/>
  <text x="445" y="232" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#52514e" text-anchor="middle">the batch it hands over is ignored — it is only the doorbell</text>
  <rect x="640" y="110" width="512" height="260" rx="16" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="660" y="142" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2a78d6" text-anchor="start">PlatformSpanExporter.export()</text>
  <text x="660" y="172" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">1  pending = store.fetch_unsynced(limit)</text>
  <text x="660" y="196" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">2  wire = [to_wire(s)]  ← apply_export_policy</text>
  <text x="660" y="220" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">3  POST /public/v1/traces/ingest   (retry, back-off)</text>
  <text x="660" y="244" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">4  2xx → store.mark_synced(ids)</text>
  <text x="660" y="268" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">5  enforce_buffer_bound(~10k spans · 7 days)</text>
  <text x="660" y="292" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">   always returns SUCCESS — the table owns retry</text>
  <polyline points="580,195 640,195" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="640,195 626.0,188.0 626.0,202.0" fill="#2a78d6"/>
  <polyline points="640,330 560,330 560,282" fill="none" stroke="#1baf7a" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="560,282 553.0,296.0 567.0,296.0" fill="#1baf7a"/>
  <rect x="428.52" y="339.65" width="142.96" height="17.55" rx="4" fill="#fcfcfb" stroke="none" stroke-width="2"/>
  <text x="500" y="352" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#52514e" text-anchor="middle">2xx → synced = 1</text>
  <rect x="48" y="420" width="340" height="150" rx="12" fill="#fdefe8" stroke="#eb6834" stroke-width="2"/>
  <text x="68" y="456" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">plane down</text>
  <text x="68" y="478" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">connect() warns and stores the connection</text>
  <text x="68" y="497" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">runs are not blocked (3 runs: 0.00 s)</text>
  <text x="68" y="516" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">rows wait, unsent, in local.db</text>
  <text x="68" y="535" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">the next drain sends them</text>
  <rect x="430" y="420" width="340" height="150" rx="12" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="450" y="456" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">re-send is idempotent</text>
  <text x="450" y="478" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">the plane dedups by span_id</text>
  <text x="450" y="497" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">a span may be POSTed twice,</text>
  <text x="450" y="516" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">it is stored once</text>
  <rect x="812" y="420" width="340" height="150" rx="12" fill="#fdefe8" stroke="#eb6834" stroke-width="2"/>
  <text x="832" y="456" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">the bound</text>
  <text x="832" y="478" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">oldest un-acked rows past ~10k / 7 days</text>
  <text x="832" y="497" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">are abandoned from re-send only —</text>
  <text x="832" y="516" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">they stay in local.db</text>
  <text x="832" y="535" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">`fastaiagent traces prune` reclaims</text>
  <text x="48" y="610" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">What the page's proof printed with nothing listening on the plane address:</text>
  <text x="48" y="636" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">rows in local.db: 6 · unsent: 6 · fetch_unsynced() hands the exporter 6 spans · after marking 2 sent: unsent=4, rows=6</text>
  <text x="48" y="672" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8a8880" text-anchor="start">Code: trace/platform_export.py::PlatformSpanExporter · trace/storage.py::fetch_unsynced / mark_synced / enforce_buffer_bound</text>
</svg>
