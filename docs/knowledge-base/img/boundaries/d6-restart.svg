  <rect x="454" y="172" width="292" height="96" rx="12" fill="#e5f6ef" stroke="#1baf7a" stroke-width="2"/>
  <text x="474" y="208" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">indexes</text>
  <text x="474" y="230" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">rebuilt from kb.sqlite</text>
  <text x="474" y="249" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">1 probe embedding, 0 re-embeds</text>
