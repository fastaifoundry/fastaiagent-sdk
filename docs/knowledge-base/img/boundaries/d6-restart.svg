  <text x="92" y="249" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">add() embeds 3 texts</text>
  <path d="M72,306 L72,384 A146.0,16 0 0 0 364,384 L364,306" fill="#e5f6ef" stroke="#1baf7a" stroke-width="2.5"/>
