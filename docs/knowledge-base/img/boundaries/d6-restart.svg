  <text x="48" y="62" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0b0b0b" text-anchor="start">The store is the source of truth — indexes are rebuilt, not re-embedded</text>
  <rect x="48" y="120" width="340" height="300" rx="18" fill="none" stroke="#8a8880" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="70" y="154" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8a8880" text-anchor="start">PROCESS A · writes</text>
  <rect x="72" y="172" width="292" height="96" rx="12" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
