  <text x="454" y="440" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">delete_by_source('errors.md') → 1 chunk, in kb.sqlite and both indexes</text>
