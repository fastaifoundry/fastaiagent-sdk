<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="One call, two shapes: astream yields TextDelta events, then Usage, then StreamDone, and ToolCallStart and ToolCallEnd with the arguments as a dict; stream folds those back into the LLMResponse complete returns; both leave the same llm span with usage; inside an agent the tool loop yields no StreamDone at all and Paused is the last event of a paused run.">
  <title>One call, two shapes: astream yields TextDelta events, then Usage, then StreamDone, and ToolCallStart and ToolCallEnd with the arguments as a dict; stream folds those back into the LLMResponse complete returns; both leave the same llm span with usage; inside an agent the tool loop yields no StreamDone at all and Paused is the last event of a paused run.</title>
  <rect x="0" y="0" width="1200" height="640" rx="0" fill="#fcfcfb" stroke="none" stroke-width="2"/>
  <text x="48" y="62" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0b0b0b" text-anchor="start">One call, two shapes — and what an agent's stream looks like</text>
  <rect x="48" y="130" width="230" height="90" rx="12" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="68" y="166" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">complete()</text>
  <text x="68" y="189" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">→ LLMResponse</text>
  <rect x="48" y="240" width="230" height="90" rx="12" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="68" y="276" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">astream()</text>
  <text x="68" y="299" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">→ typed events</text>
  <rect x="48" y="350" width="230" height="90" rx="12" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="68" y="386" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">stream()</text>
  <text x="68" y="408" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">events folded → LLMResponse</text>
  <rect x="330" y="264" width="168" height="42" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="344" y="290.76" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b0b0b" text-anchor="start">TextDelta × 13</text>
  <polyline points="498,285 528,285" fill="none" stroke="#8a8880" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="528,285 514.0,278.0 514.0,292.0" fill="#8a8880"/>
  <rect x="528" y="264" width="78" height="42" rx="8" fill="#e5f6ef" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="542" y="290.76" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b0b0b" text-anchor="start">Usage</text>
  <polyline points="606,285 636,285" fill="none" stroke="#8a8880" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="636,285 622.0,278.0 622.0,292.0" fill="#8a8880"/>
  <rect x="636" y="264" width="128" height="42" rx="8" fill="#ffffff" stroke="#d6d4cc" stroke-width="1.5"/>
  <text x="650" y="290.76" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b0b0b" text-anchor="start">StreamDone</text>
  <polyline points="278,285 330,285" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="330,285 316.0,278.0 316.0,292.0" fill="#2a78d6"/>
  <text x="330" y="340" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">with a tool: ToolCallStart('get_weather') → ToolCallEnd(arguments={'city': 'Paris'})</text>
  <text x="330" y="170" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">content '1, 2, 3, 4, 5' · finish 'stop' · usage 22 / 13 / 35</text>
  <text x="330" y="192" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">identical from complete() and stream()</text>
  <rect x="820" y="130" width="332" height="160" rx="12" fill="#e5f6ef" stroke="#1baf7a" stroke-width="2"/>
  <text x="840" y="166" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">the llm span, either way</text>
  <text x="840" y="188" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">llm.openai.gpt-4.1-mini</text>
  <text x="840" y="207" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">gen_ai.usage.input_tokens 22</text>
  <text x="840" y="226" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">gen_ai.usage.output_tokens 13</text>
  <text x="840" y="245" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">(no span on a stream before 1.68.0)</text>
  <rect x="48" y="470" width="740" height="130" rx="12" fill="#ffffff" stroke="#d6d4cc" stroke-width="2"/>
  <text x="68" y="506" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">Agent.astream() — a two-turn tool loop, offline</text>
  <text x="68" y="528" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">ToolCallStart · ToolCallEnd · Usage · TextDelta · Usage</text>
  <text x="68" y="547" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">no StreamDone: the loop suppresses it between turns and the generator simply ends</text>
  <text x="68" y="566" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">a paused run ends with a Paused event instead; resume with aresume()</text>
  <circle cx="832" cy="500" r="14" fill="#fcfcfb"/>
  <line x1="825" y1="493" x2="839" y2="507" stroke="#eb6834" stroke-width="3"/>
  <line x1="825" y1="507" x2="839" y2="493" stroke="#eb6834" stroke-width="3"/>
  <text x="850" y="506" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#eb6834" text-anchor="start">bedrock: no streaming</text>
  <polyline points="822,546 829,554 843,537" fill="none" stroke="#1baf7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="850" y="552" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1baf7a" text-anchor="start">a streamed turn stores the same</text>
  <text x="850" y="572" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1baf7a" text-anchor="start">memory as run() — memory page, §1</text>
</svg>
