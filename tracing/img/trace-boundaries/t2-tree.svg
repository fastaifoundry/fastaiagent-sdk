<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Nesting is discovered, not declared: each run pushes its span onto OTel's context, a ContextVar, so a span opened anywhere inside, including in a tool body, attaches to the current span; two runs at once keep separate contexts; the rows carry parent_span_id and the tree is rebuilt from it.">
  <title>Nesting is discovered, not declared: each run pushes its span onto OTel's context, a ContextVar, so a span opened anywhere inside, including in a tool body, attaches to the current span; two runs at once keep separate contexts; the rows carry parent_span_id and the tree is rebuilt from it.</title>
  <rect x="0" y="0" width="1200" height="700" rx="0" fill="#fcfcfb" stroke="none" stroke-width="2"/>
  <text x="48" y="62" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0b0b0b" text-anchor="start">Between calls: the tree is discovered, not declared</text>
