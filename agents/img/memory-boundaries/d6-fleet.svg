<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Laptop to fleet: every process uses the same Memory API over one FactStore contract, backed by SQLite, Postgres or Redis; conversation windows stay in each process.">
