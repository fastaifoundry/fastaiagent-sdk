  <text x="48" y="626" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">Every process points at the same store. Windows never leave their process: keep a user on one process, or save()/load().</text>
