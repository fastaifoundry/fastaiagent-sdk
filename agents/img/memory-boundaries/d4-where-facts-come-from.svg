  <text x="770" y="252" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">fact store</text>
  <text x="770" y="290" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">user:dana</text>
  <text x="770" y="313" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#52514e" text-anchor="middle">agent:pet-shop</text>
