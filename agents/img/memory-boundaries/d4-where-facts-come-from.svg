  <polygon points="660,320 646.0,313.0 646.0,327.0" fill="#2a78d6"/>
  <polyline points="610,456 660,384" fill="none" stroke="#52514e" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="660,384 646.3,391.5 657.8,399.5" fill="#52514e"/>
  <rect x="920" y="220" width="232" height="120.0" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="934" y="252" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">Learned facts (user):</text>
  <text x="934" y="274.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">- a greyhound, Pepper</text>
  <text x="934" y="296.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">- works night shifts</text>
  <text x="934" y="318.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">- prefers email</text>
  <polyline points="880,300 920,300" fill="none" stroke="#1baf7a" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="920,300 906.0,293.0 906.0,307.0" fill="#1baf7a"/>
  <text x="920" y="374.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">each fact once</text>
  <text x="920" y="397.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">newest 50 per turn</text>
  <text x="920" y="420.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">no user id in the prompt</text>
  <text x="330" y="570" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">The cap deletes the oldest learned facts. Facts you persisted are never pruned.</text>
</svg>
