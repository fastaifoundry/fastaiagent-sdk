  <polyline points="630,330 840,280" fill="none" stroke="#52514e" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="840,280 824.8,276.4 828.0,290.1" fill="#52514e"/>
  <rect x="672.875" y="301.85" width="154.25" height="22.950000000000003" rx="4" fill="#fcfcfb" stroke="none" stroke-width="2"/>
  <text x="750" y="318" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#52514e" text-anchor="middle">persist · learn</text>
  <polyline points="840,432 630,356" fill="none" stroke="#52514e" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6"/>
  <polygon points="630,356 640.8,367.3 645.5,354.2" fill="#52514e"/>
  <rect x="700.925" y="391.85" width="98.15" height="22.950000000000003" rx="4" fill="#fcfcfb" stroke="none" stroke-width="2"/>
  <text x="750" y="408" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#52514e" text-anchor="middle">read-only</text>
  <polyline points="844,530 851,538 865,521" fill="none" stroke="#1baf7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="874" y="537" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1baf7a" text-anchor="start">survives a restart</text>
</svg>
