<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Four kinds of memory: the window and in-conversation blocks live in the process and are lost on restart; durable facts and plane facts live outside it.">
  <title>Four kinds of memory: the window and in-conversation blocks live in the process and are lost on restart; durable facts and plane facts live outside it.</title>
  <rect x="0" y="0" width="1200" height="600" rx="0" fill="#fcfcfb" stroke="none" stroke-width="2"/>
  <text x="48" y="62" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0b0b0b" text-anchor="start">Four kinds of memory — and where each one lives</text>
  <rect x="48" y="120" width="612" height="420" rx="18" fill="none" stroke="#8a8880" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="72" y="156" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#8a8880" text-anchor="start">YOUR PROCESS</text>
  <rect x="76" y="180" width="300" height="116" rx="12" fill="#ffffff" stroke="#d6d4cc" stroke-width="2"/>
  <text x="96" y="216" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">Conversation window</text>
  <text x="96" y="244" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">recent messages, verbatim</text>
  <text x="96" y="268" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">one per user</text>
  <rect x="76" y="330" width="300" height="116" rx="12" fill="#ffffff" stroke="#d6d4cc" stroke-width="2"/>
  <text x="96" y="366" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">Summary &amp; recall</text>
  <text x="96" y="394" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">running summary</text>
  <text x="96" y="418" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">past messages, by meaning</text>
  <rect x="430" y="270" width="200" height="104" rx="12" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="450" y="306" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">Agent turn</text>
  <text x="450" y="334" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">builds the prompt</text>
  <polyline points="376,238 404,238 404,300 430,300" fill="none" stroke="#52514e" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="430,300 416.0,293.0 416.0,307.0" fill="#52514e"/>
  <polyline points="376,388 404,388 404,344 430,344" fill="none" stroke="#52514e" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="430,344 416.0,337.0 416.0,351.0" fill="#52514e"/>
  <circle cx="90" cy="506" r="15" fill="#fcfcfb"/>
  <line x1="82" y1="498" x2="98" y2="514" stroke="#eb6834" stroke-width="3"/>
  <line x1="82" y1="514" x2="98" y2="498" stroke="#eb6834" stroke-width="3"/>
  <text x="112" y="513" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#eb6834" text-anchor="start">gone when the process restarts, unless you save() it</text>
  <path d="M840,156 L840,304 A156.0,16 0 0 0 1152,304 L1152,156" fill="#e5f6ef" stroke="#1baf7a" stroke-width="2.5"/>
  <ellipse cx="996.0" cy="156" rx="156.0" ry="16" fill="#e5f6ef" stroke="#1baf7a" stroke-width="2.5"/>
  <text x="996" y="200" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">Durable facts</text>
  <text x="996" y="234" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#52514e" text-anchor="middle">SQLite · Postgres · Redis</text>
  <text x="996" y="258" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#52514e" text-anchor="middle">scoped: agent / user</text>
  <rect x="840" y="372" width="312" height="120" rx="12" fill="#ffffff" stroke="#d6d4cc" stroke-width="2"/>
  <text x="860" y="408" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">Plane facts</text>
  <text x="860" y="436" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">curated and approved</text>
  <text x="860" y="460" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">on the Enterprise plane</text>
  <polyline points="840,236 630,296" fill="none" stroke="#1baf7a" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="630,296 645.4,298.9 641.5,285.4" fill="#1baf7a"/>
  <rect x="672.875" y="237.85" width="154.25" height="22.950000000000003" rx="4" fill="#fcfcfb" stroke="none" stroke-width="2"/>
