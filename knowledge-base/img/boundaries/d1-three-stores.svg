  <text x="320" y="189" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">seams · chunk_size</text>
  <polyline points="510,178 552,178" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="552,178 538.0,171.0 538.0,185.0" fill="#2a78d6"/>
  <rect x="552" y="130" width="230" height="96" rx="12" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
