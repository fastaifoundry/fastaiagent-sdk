  <path d="M774,296 L774,394 A189.0,16 0 0 0 1152,394 L1152,296" fill="#e5f6ef" stroke="#1baf7a" stroke-width="2.5"/>
  <ellipse cx="963.0" cy="296" rx="189.0" ry="16" fill="#e5f6ef" stroke="#1baf7a" stroke-width="2.5"/>
  <text x="963" y="330" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="middle">MetadataStore · SQLite</text>
  <text x="963" y="356" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="middle">documents · chunks · embeddings</text>
  <text x="963" y="375" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="middle">the source of truth: indexes rebuild from it</text>
  <polyline points="213,400 213,450" fill="none" stroke="#1baf7a" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="213,450 220.0,436.0 206.0,436.0" fill="#1baf7a"/>
  <polyline points="576,400 576,450" fill="none" stroke="#1baf7a" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="576,450 583.0,436.0 569.0,436.0" fill="#1baf7a"/>
  <rect x="48" y="450" width="330" height="110" rx="12" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="68" y="486" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">search(query, top_k)</text>
  <text x="68" y="509" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">vector · keyword · hybrid (default)</text>
  <text x="68" y="529" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">→ list[SearchResult(chunk, score)]</text>
  <polyline points="378,505 411,505" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="411,505 397.0,498.0 397.0,512.0" fill="#2a78d6"/>
  <rect x="411" y="450" width="330" height="110" rx="12" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="431" y="486" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">as_tool()</text>
  <text x="431" y="509" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">FunctionTool search_&lt;name&gt;, origin kb</text>
  <text x="431" y="529" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">the model calls it; the result is text</text>
  <polyline points="741,505 774,505" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="774,505 760.0,498.0 760.0,512.0" fill="#2a78d6"/>
  <rect x="774" y="450" width="378" height="110" rx="12" fill="#e5f6ef" stroke="#1baf7a" stroke-width="2"/>
  <text x="794" y="486" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">retrieval.&lt;name&gt; span</text>
  <text x="794" y="509" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">query · backend · search_type · top_k</text>
  <text x="794" y="529" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">result_count · latency_ms · doc_ids</text>
  <text x="48" y="610" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52514e" text-anchor="start" font-style="italic">PlatformKB has the same search() and as_tool(); the three stores then live on the plane.</text>
</svg>
