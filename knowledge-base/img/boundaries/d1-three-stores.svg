  <text x="68" y="349" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">FAISS (default) · Qdrant · Chroma</text>
  <text x="68" y="369" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">cosine in [-1, 1]</text>
  <rect x="411" y="290" width="330" height="110" rx="12" fill="#e5f6ef" stroke="#1baf7a" stroke-width="2"/>
  <text x="431" y="326" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">KeywordStore</text>
