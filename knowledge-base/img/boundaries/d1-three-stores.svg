<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="A knowledge base is three stores behind one interface: documents go through the chunker and the embedder into a VectorStore (FAISS by default), a KeywordStore (BM25) and a MetadataStore (SQLite), which is the source of truth the indexes are rebuilt from; search() returns scored chunks, as_tool() wraps it for the model, and every search is a retrieval span.">
  <title>A knowledge base is three stores behind one interface: documents go through the chunker and the embedder into a VectorStore (FAISS by default), a KeywordStore (BM25) and a MetadataStore (SQLite), which is the source of truth the indexes are rebuilt from; search() returns scored chunks, as_tool() wraps it for the model, and every search is a retrieval span.</title>
  <rect x="0" y="0" width="1200" height="640" rx="0" fill="#fcfcfb" stroke="none" stroke-width="2"/>
  <text x="48" y="62" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0b0b0b" text-anchor="start">A knowledge base is three stores behind one interface</text>
  <rect x="48" y="130" width="210" height="96" rx="12" fill="#ffffff" stroke="#d6d4cc" stroke-width="2"/>
  <text x="68" y="166" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">documents</text>
  <text x="68" y="189" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">text · .md · .txt · .pdf</text>
