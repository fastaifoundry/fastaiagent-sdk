  <text x="572" y="189" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">FastEmbed · OpenAI · Simple</text>
  <polyline points="405,226 405,290" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="405,290 412.0,276.0 398.0,276.0" fill="#2a78d6"/>
  <polyline points="667,226 667,260 213,260 213,290" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="213,290 220.0,276.0 206.0,276.0" fill="#2a78d6"/>
  <polyline points="667,260 963,260 963,290" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linejoin="round"/>
