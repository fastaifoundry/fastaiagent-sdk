<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="A document becomes chunks at the seams: the splitter tries paragraph, line, sentence and word boundaries in order and merges pieces up to chunk_size; at 120 characters the policy document becomes five chunks with start and end offsets; neighbours share no text, so chunk_overlap has no effect and a rule that straddles a seam is split across two chunks.">
  <title>A document becomes chunks at the seams: the splitter tries paragraph, line, sentence and word boundaries in order and merges pieces up to chunk_size; at 120 characters the policy document becomes five chunks with start and end offsets; neighbours share no text, so chunk_overlap has no effect and a rule that straddles a seam is split across two chunks.</title>
  <rect x="0" y="0" width="1200" height="640" rx="0" fill="#fcfcfb" stroke="none" stroke-width="2"/>
  <text x="48" y="62" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0b0b0b" text-anchor="start">A document becomes chunks at the seams — and nothing crosses a seam</text>
  <rect x="48" y="120" width="640" height="156.0" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="62" y="152" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">the document — three paragraphs, 428 characters</text>
  <text x="62" y="173.0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">Refund policy. Items can be sent back within 30 days of</text>
  <text x="62" y="194.0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">purchase for a full refund. They must be unused and in</text>
  <text x="62" y="215.0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">their original packaging. Digital products are final.</text>
  <text x="62" y="236.0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">¶  Shipping. Domestic orders ship in 3-5 business days …</text>
  <text x="62" y="257.0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">¶  Support. Email support@example.com … 9am to 5pm EST.</text>
  <rect x="760" y="130" width="250" height="40" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="774" y="155.4" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#0b0b0b" text-anchor="start">¶  paragraph  \n\n</text>
  <polyline points="885,170 885,180" fill="none" stroke="#8a8880" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="760" y="180" width="250" height="40" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="774" y="205.4" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#0b0b0b" text-anchor="start">line  \n</text>
  <polyline points="885,220 885,230" fill="none" stroke="#8a8880" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="760" y="230" width="250" height="40" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="774" y="255.4" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#0b0b0b" text-anchor="start">sentence  '. '</text>
  <polyline points="885,270 885,280" fill="none" stroke="#8a8880" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="760" y="280" width="250" height="40" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="774" y="305.4" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#0b0b0b" text-anchor="start">word  ' '</text>
  <polyline points="885,320 885,330" fill="none" stroke="#8a8880" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="760" y="330" width="250" height="40" rx="8" fill="#fdefe8" stroke="#eb6834" stroke-width="1.5"/>
  <text x="774" y="355.4" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#0b0b0b" text-anchor="start">hard split</text>
  <text x="1030" y="150" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">tried in order;</text>
  <text x="1030" y="170" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">pieces merged</text>
  <text x="1030" y="190" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">up to chunk_size</text>
  <rect x="48" y="330" width="1104" height="147.0" rx="10" fill="#e5f6ef" stroke="#1baf7a" stroke-width="2"/>
  <text x="62" y="362" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">chunk_size=120 → 5 chunks  (chunk_overlap=50)</text>
  <text x="62" y="381.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">#0 [  0- 82]  Refund policy. Items can be sent back within 30 days of purchase for a full refund.</text>
  <text x="62" y="401.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">#1 [ 84-164]  They must be unused and in their original packaging. Digital products are final.</text>
  <text x="62" y="421.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">#2 [166-263]  Shipping. Domestic orders ship in 3-5 business days. International orders take 7-14 …</text>
  <text x="62" y="441.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">#3 [265-325]  Express shipping can be chosen at checkout for an extra fee.</text>
  <text x="62" y="461.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">#4 [327-428]  Support. Email support@example.com or call 1-800-EXAMPLE. Hours are Monday to Friday …</text>
  <circle cx="60" cy="530" r="14" fill="#fcfcfb"/>
  <line x1="53" y1="523" x2="67" y2="537" stroke="#eb6834" stroke-width="3"/>
  <line x1="53" y1="537" x2="67" y2="523" stroke="#eb6834" stroke-width="3"/>
  <text x="78" y="536" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#eb6834" text-anchor="start">chunk_overlap=50 is accepted and has no effect: neighbours share −2 characters, the seam itself</text>
  <circle cx="60" cy="566" r="14" fill="#fcfcfb"/>
  <line x1="53" y1="559" x2="67" y2="573" stroke="#eb6834" stroke-width="3"/>
  <line x1="53" y1="573" x2="67" y2="559" stroke="#eb6834" stroke-width="3"/>
  <text x="78" y="572" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#eb6834" text-anchor="start">'within 30 days … full refund' is chunk #0; 'unused … original packaging' is chunk #1 — one rule, two chunks</text>
  <polyline points="50,606 57,614 71,597" fill="none" stroke="#1baf7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="78" y="612" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1baf7a" text-anchor="start">every chunk keeps source, index, start_char and end_char</text>
</svg>
